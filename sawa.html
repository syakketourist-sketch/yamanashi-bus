<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマホつかいすぎチェック！</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --bg-color: #F4F7F6;
      --card-bg: #FFFFFF;
      --text-color: #333333;
      --alert-color: #E74C3C;
      --safe-color: #2ECC71;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 24px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      color: var(--primary-color);
    }

    .card {
      background: #F8FAFC;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border-left: 5px solid var(--primary-color);
    }

    .card.highlight {
      background: #EBF3FA;
      border-left-color: #3182CE;
    }

    .card-label {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 4px;
    }

    .card-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #2D3748;
    }

    .remaining-value {
      color: var(--safe-color);
    }

    .remaining-value.warning {
      color: var(--alert-color);
    }

    .sub-info {
      font-size: 0.8rem;
      color: #888;
      margin-top: 4px;
    }

    .loading, .error {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      color: #666;
    }

    .error {
      color: var(--alert-color);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📱 スマホの利用時間</h1>

  <div id="loading" class="loading">データを読み込んでいます...</div>
  <div id="error" class="error" style="display: none;"></div>

  <div id="content" style="display: none;">
    <!-- 直近10日間平均 -->
    <div class="card">
      <div class="card-label">直近10日間の平均（1日あたり）</div>
      <div class="card-value" id="avg-10days">-</div>
    </div>

    <!-- 今月の平均 -->
    <div class="card">
      <div class="card-label">今月（1日〜今日）の平均（1日あたり）</div>
      <div class="card-value" id="avg-monthly">-</div>
    </div>

    <!-- 残り利用可能時間 -->
    <div class="card highlight">
      <div class="card-label">今月あと使える時間（目安）</div>
      <div class="card-value remaining-value" id="remaining-hours">-</div>
      <div class="sub-info" id="month-target-info">今月の目標: -</div>
    </div>
  </div>
</div>

<script>
  // -------------------------------------------------------------
  // 1. GoogleスプレッドシートのCSV URLをここに設定してください
  // -------------------------------------------------------------
  const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS4jtSCfwqqIXekT3koXuDagVa2DembUfvWAPHbxp4In9tL828aCbBUWMNv7457jfJUyn4TCPH2BnK7/pub?output=csv';

  async function fetchData() {
    try {
      const response = await fetch(SPREADSHEET_CSV_URL);
      if (!response.ok) throw new Error('データの取得に失敗しました');
      
      const csvText = await response.text();
      processData(csvText);
    } catch (err) {
      document.getElementById('loading').style.display = 'none';
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'block';
      errorEl.innerText = 'データを読み込めませんでした。URLを確認してください。';
    }
  }

  // 「1:30」や「01:30:00」のような時刻文字列、または数値を時間に変換する関数
  function parseTimeStringToHours(timeStr) {
    if (!timeStr) return 0;
    
    // すでに数値の場合（例: 1.5）
    if (!isNaN(timeStr)) {
      return parseFloat(timeStr);
    }

    // 「1:30」や「1:30:00」などの時間表記を分割処理
    const parts = timeStr.split(':');
    if (parts.length >= 2) {
      const hours = parseInt(parts[0], 10) || 0;
      const minutes = parseInt(parts[1], 10) || 0;
      return hours + (minutes / 60);
    }

    return 0;
  }

  // 時間（数値）を「○時間○分」の読みやすい形式に変換する関数
  function formatHoursToHM(hoursNum) {
    if (hoursNum <= 0) return '0分';
    const totalMinutes = Math.round(hoursNum * 60);
    const h = Math.floor(totalMinutes / 60);
    const m = totalMinutes % 60;
    
    if (h === 0) return `${m}分`;
    if (m === 0) return `${h}時間`;
    return `${h}時間${m}分`;
  }

  function processData(csvText) {
    const lines = csvText.trim().split('\n');
    const records = [];

    // 1行目はヘッダーとみなし、2行目から読み込む
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
      
      // A列（日付）と D列（使用時間：インデックスは3）が存在するか確認
      if (cols.length >= 4 && cols[0] && cols[3] !== '') {
        const date = new Date(cols[0]);
        const hours = parseTimeStringToHours(cols[3]);
        
        if (!isNaN(date.getTime())) {
          records.push({ date, hours });
        }
      }
    }

    if (records.length === 0) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').innerText = '有効なデータが見つかりませんでした。';
      return;
    }

    // 日付順（古い順）にソート
    records.sort((a, b) => a.date - b.date);

    // 本日の日付・今月の情報取得
    const today = new Date();
    const currentYear = today.getFullYear();
    const currentMonth = today.getMonth(); // 0-indexed
    const daysInCurrentMonth = new Date(currentYear, currentMonth + 1, 0).getDate(); // 当月の日数（30か31など）

    // 1. 今月のデータ抽出（1日〜今日）
    const monthlyRecords = records.filter(r => 
      r.date.getFullYear() === currentYear && r.date.getMonth() === currentMonth
    );

    // 今月の合計時間・平均時間計算
    const monthlyTotalHours = monthlyRecords.reduce((sum, r) => sum + r.hours, 0);
    const monthlyAvg = monthlyRecords.length > 0 ? (monthlyTotalHours / monthlyRecords.length) : 0;

    // 2. 直近10日間の平均計算
    const recent10Records = records.slice(-10);
    const recent10TotalHours = recent10Records.reduce((sum, r) => sum + r.hours, 0);
    const recent10Avg = recent10Records.length > 0 ? (recent10TotalHours / recent10Records.length) : 0;

    // 3. 今月の残り利用可能時間（月の総日数 × 1時間 - 今月の累計時間）
    const monthTargetHours = daysInCurrentMonth * 1; // 1日1時間ルール
    const remainingHours = monthTargetHours - monthlyTotalHours;

    // 表示への反映（「1時間15分」などの読みやすい形式で表示）
    document.getElementById('avg-10days').innerText = formatHoursToHM(recent10Avg);
    document.getElementById('avg-monthly').innerText = formatHoursToHM(monthlyAvg);
    
    const remainingEl = document.getElementById('remaining-hours');
    remainingEl.innerText = formatHoursToHM(remainingHours);
    
    // 残り時間が5時間未満になったら文字を赤くする警告表示
    if (remainingHours < 5) {
      remainingEl.classList.add('warning');
    }

    document.getElementById('month-target-info').innerText = 
      `今月の目標: ${monthTargetHours}時間以内（現在 ${formatHoursToHM(monthlyTotalHours)} 使用中）`;

    // 画面切り替え
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  }

  // 実行
  fetchData();
</script>

</body>
</html>
